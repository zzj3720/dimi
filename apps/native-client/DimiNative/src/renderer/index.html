<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; img-src 'self' data:;" />
  <title>Dimi Client</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- Header -->
    <header class="header">
      <span class="brand">Dimi</span>
      <span id="connection-badge" class="badge badge-secondary">connecting…</span>
      <span id="busy-badge" class="badge badge-primary hidden">busy</span>
      <span id="phase-badge" class="badge badge-outline hidden"></span>
      <span id="status-msg" class="status-msg"></span>
      <span class="spacer"></span>
      <button id="btn-sessions" class="btn btn-ghost">Sessions</button>
      <button id="btn-refresh" class="btn btn-ghost">Refresh</button>
    </header>

    <!-- Transcript -->
    <main id="transcript" class="transcript" tabindex="-1"></main>

    <!-- Composer: TUI-style bordered editor + 2-line status footer -->
    <footer class="composer">
      <div id="completion" class="completion hidden"></div>
      <div id="editor-frame" class="editor-frame">
        <div class="editor-top">
          <span class="corner">╭</span>
          <span id="editor-label" class="editor-label hidden"></span>
          <span class="fill"></span>
          <span class="corner">╮</span>
        </div>
        <div class="editor-row">
          <span class="bar">│</span>
          <span id="prompt-token" class="prompt-token">&gt;</span>
          <textarea id="input" class="input" rows="1" placeholder="Message…" autofocus></textarea>
          <span class="bar">│</span>
        </div>
        <div class="editor-bottom">
          <span class="corner">╰</span>
          <span class="fill"></span>
          <span class="corner">╯</span>
        </div>
      </div>
      <div class="footer-line1">
        <span id="footer-status" class="footer-status"></span>
        <span class="spacer"></span>
        <span id="queued-count" class="queued-count hidden"></span>
        <span id="footer-actions" class="footer-actions">
          <button id="btn-steer" class="btn btn-ghost hidden">steer</button>
          <button id="btn-queue" class="btn btn-ghost hidden">queue</button>
          <button id="btn-cancel" class="btn btn-ghost hidden">Cancel</button>
          <button id="btn-send" class="btn btn-primary">Send</button>
        </span>
        <span id="footer-tips" class="footer-tips"></span>
      </div>
      <div class="footer-line2">
        <span id="hint" class="hint"></span>
        <span class="spacer"></span>
        <span id="footer-context" class="footer-context"></span>
      </div>
    </footer>

    <!-- Dialogs (modal overlays) -->
    <div id="dialog-root" class="dialog-root"></div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
