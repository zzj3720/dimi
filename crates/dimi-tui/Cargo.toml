[package]
name = "dimi-tui"
description = "Rust terminal UI — differential rendering core ported from @dimi-agent/pi-tui, plus the dimi TUI components and controllers (M5). Contract-aligned so every migrated component can be diffed against the TS TUI frame-by-frame."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
comrak = "0.54"
nix = { version = "0.29", features = ["term"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
