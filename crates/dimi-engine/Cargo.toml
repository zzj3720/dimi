[package]
name = "dimi-engine"
description = "dimi turn orchestration core — the M3 swap-in socket for the TS loop domain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
aimux-core = "0.1"
aimux-providers = "0.1"
dimi-wire = { path = "../dimi-wire" }
dimi-exec = { path = "../dimi-exec" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
async-trait = "0.1.91"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
