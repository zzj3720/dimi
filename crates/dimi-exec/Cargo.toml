[package]
name = "dimi-exec"
description = "OS process/exec layer: spawn, process-group kill, stdio piping — mirror of agent-core-v2 os/backends/node-local/hostProcessService.ts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
libc = "0.2"

# setsid/kill are plain libc calls; the workspace default `unsafe_code =
# "forbid"` cannot apply (same carve-out as dimi-bridge).
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
