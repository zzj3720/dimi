name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Smoke test CLI bundle
        run: pnpm -C apps/dimi run smoke

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Reuse the vitest transform cache (node_modules/.vite, vitest's default
      # location) across shards and runs — re-transforming the monorepo's
      # sources is the dominant cost of the test jobs. Safe to restore stale:
      # entries are keyed by file content, so old cache items are simply not
      # hit after source changes.
      - name: Cache vitest transform cache
        uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: ${{ runner.os }}-vitest-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-vitest-

      - run: pnpm run test --shard=${{ matrix.shard }}/5

  # pi-tui's suite runs on node:test (not vitest), so the root `pnpm run test`
  # does not execute it; it needs its own job.
  test-pi-tui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dimi-agent/pi-tui test

  # dimi-wire / dimi-bridge: cargo tests + the napi-rs addon + the TS↔Rust
  # differential suite. Requires a Rust toolchain (the rest of CI does not).
  test-rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Cargo tests
        run: cargo test -p dimi-wire -p dimi-bridge
      - name: Build native binding
        run: pnpm --filter @dimi-agent/dimi-native run build:native
      - name: Differential suite
        run: pnpm --filter @dimi-agent/dimi-native test

  test-windows:
    runs-on: windows-latest
    # Temporarily disabled while Windows tests are being stabilized.
    if: false

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Windows runners are slower and run the whole suite (including
      # in-process e2e tests) under more contention, so the default 5s test
      # timeout causes flaky failures. Give it more headroom.
      - run: pnpm run test -- --testTimeout=30000

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run sherif

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: |
          # Resolve tsgo once, then typecheck the projects in parallel (3 at a
          # time) — serial tsgo runs plus a per-project `pnpm dlx` dominated
          # this job's runtime.
          TSGO="$(pnpm dlx --package @typescript/native-preview@beta sh -c 'command -v tsgo')"
          export TSGO
          printf '%s\n' packages/*/tsconfig.json apps/dimi/tsconfig.json \
            | xargs -P 3 -I {} sh -c 'echo "Typechecking {}" && "$TSGO" -p "{}" --noEmit'
      - name: Typecheck dimi-web (vue-tsc)
        run: pnpm --filter @dimi-agent/dimi-web run typecheck
      - name: Typecheck vis-server
        run: pnpm --filter @dimi-agent/vis-server run typecheck
      - name: Typecheck vis-web
        run: pnpm --filter @dimi-agent/vis-web run typecheck
