name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'zzj3720'
    outputs:
      packages_published: ${{ steps.changesets.outputs.published }}
      dimi_native_release: ${{ steps.dimi-release.outputs.should_publish }}
      dimi_release_tag: ${{ steps.dimi-release.outputs.tag }}
    permissions:
      contents: write
      pull-requests: write # changelog generation resolves PR info via the API
      id-token: write # Required for NPM Trusted Publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Version packages
        id: version
        run: |
          pnpm run version:release
          if git diff --quiet HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push version bump
        if: steps.version.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: release packages"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        id: changesets
        run: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Report publish outputs
        run: |
          VERSION="$(node -e 'console.log(require("./apps/dimi/package.json").version)')"
          LATEST="$(npm view @dimi-agent/cli version 2>/dev/null || echo none)"
          if [ "$VERSION" = "$LATEST" ] && [ "$LATEST" != "none" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            printf 'CHANGESETS_PUBLISHED_PACKAGES=[{"name":"@dimi-agent/cli","version":"%s"}]\n' "$VERSION" >> "$GITHUB_ENV"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Dimi native release
        if: steps.changesets.outputs.published == 'true'
        id: dimi-release
        run: node apps/dimi/scripts/native/resolve-release.mjs
        env:
          CHANGESETS_PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}

  deploy-docs:
    name: Deploy docs
    needs: release
    if: needs.release.outputs.packages_published == 'true'
    uses: ./.github/workflows/docs-deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  native-artifacts:
    name: Native release artifact
    needs: release
    if: needs.release.outputs.dimi_native_release == 'true'
    uses: ./.github/workflows/_native-build.yml
    with:
      upload-artifact-prefix: dimi-native
      retention-days: 7
      sign-macos: false

  publish-native-assets:
    name: Publish native release assets
    needs:
      - release
      - native-artifacts
    if: needs.release.outputs.dimi_native_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dimi-native-*
          path: dist-native-release
          merge-multiple: true

      - name: Produce manifest.json
        env:
          RELEASE_TAG: ${{ needs.release.outputs.dimi_release_tag }}
        run: node apps/dimi/scripts/native/produce-manifest.mjs dist-native-release "$RELEASE_TAG"

      - name: Stage update-channel assets
        env:
          RELEASE_TAG: ${{ needs.release.outputs.dimi_release_tag }}
        run: |
          VERSION="$(node -e 'const m=require("./dist-native-release/manifest.json"); process.stdout.write(m.version)')"
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          printf '{"version":"%s","publishedAt":"%s","rollout":[]}\n' "$VERSION" "$PUBLISHED_AT" > latest.json
          cp scripts/install.sh scripts/install.ps1 dist-native-release/
          # Published marketplace: rewrite relative plugin sources to flat
          # release-asset URLs, then attach official plugin zips.
          node apps/dimi/scripts/native/produce-marketplace.mjs dist-native-release "$RELEASE_TAG"

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.dimi_release_tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Dimi $RELEASE_TAG" --notes "Dimi release $RELEASE_TAG"
          fi

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.dimi_release_tag }}
        run: gh release upload "$RELEASE_TAG" dist-native-release/* latest.json --clobber
