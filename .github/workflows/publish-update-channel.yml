name: publish-update-channel

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Tag is not a valid semver: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          printf '{"version":"%s","publishedAt":"%s","rollout":[]}\n' "$VERSION" "$PUBLISHED_AT" > latest.json
          echo "latest.json:" && cat latest.json

      - name: Publish update manifest to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
