packages:
  - packages/*
  - apps/*
  - docs

onlyBuiltDependencies:
  # node-pty's postinstall downloads/compiles its native pty.node; pnpm 10
  # blocks dependency build scripts by default, which leaves the pty
  # differential suite (and the legacy terminal backend) without a binary.
  - node-pty
  # electron's postinstall downloads the platform binary.
  - electron

catalog:
  zod: 4.3.6

overrides:
  "dimi>@tailwindcss/vite": "4.1.18"
  "ssh2@1.17.0>cpu-features": "-"
  "ssh2@1.17.0>nan": "-"
  "dimi>tailwindcss": "4.1.18"
